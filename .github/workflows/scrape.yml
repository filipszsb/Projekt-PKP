name: PKP Delay Scraper

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repo
        uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Odpal scraper
        run: python scraper.py

      - name: Zapisz CSV do repo
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add opoznienia_pp.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Aktualizacja opóźnień PKP"
          git push
